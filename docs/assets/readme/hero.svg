<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="t">
<title id="t">GalaxyCrash — root on a locked bootloader, no custom kernel, gone on reboot</title>
<style>

.serif { font-family: Fraunces, 'Iowan Old Style', Georgia, 'Times New Roman', serif; }
.sans { font-family: Manrope, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
.mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
.head { fill: #8fd8bc; font-weight: 600; letter-spacing: .02em; }
.dim { fill: #8fa8bc; }
.rise { animation: rise 1.1s cubic-bezier(.22,1,.36,1) both; }
.d1 { animation-delay: .15s; } .d2 { animation-delay: .3s; } .d3 { animation-delay: .45s; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.glow { animation: breathe 7s ease-in-out infinite; transform-origin: 940px 210px; }
@keyframes breathe { 0%,100% { opacity: .5; transform: scale(1); } 50% { opacity: .85; transform: scale(1.07); } }
.wire { stroke: #8fa8bc; stroke-opacity: .32; stroke-width: 2; fill: none; }
.pulse { stroke: #7fd1a8; stroke-width: 3; fill: none; stroke-linecap: round;
  stroke-dasharray: 14 520; animation: flow 3.4s linear infinite; }
.p2 { animation-delay: 1.15s; } .p3 { animation-delay: 2.3s; }
@keyframes flow { from { stroke-dashoffset: 534; } to { stroke-dashoffset: 0; } }
.node { animation: rise 1s cubic-bezier(.22,1,.36,1) both; }
.n1 { animation-delay: .5s; } .n2 { animation-delay: .7s; } .n3 { animation-delay: .9s; }
.halo { stroke: #7fd1a8; stroke-width: 1.5; opacity: 0; animation: halo 6.4s ease-in-out infinite; }
.n1 .halo { animation-delay: 1s; } .n2 .halo { animation-delay: 3.1s; } .n3 .halo { animation-delay: 5.2s; }
@keyframes halo { 0%,100% { opacity: 0; } 12% { opacity: 1; } 30% { opacity: 0; } }
.led { fill: #7fd1a8; animation: led 2.4s ease-in-out infinite; }
@keyframes led { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
.ghost { animation: ghost 6s ease-in-out infinite; }
@keyframes ghost { 0%,100% { opacity: .5; } 50% { opacity: .22; } }
.caret { fill: #2b5cf0; animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ember { animation: ember 5.5s ease-in-out infinite; }
@keyframes ember { 0%,100% { opacity: .35; } 50% { opacity: .75; } }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; } .pulse { opacity: 0; } }
</style>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#071018"/><stop offset="1" stop-color="#0e1c2e"/>
  </linearGradient>
  <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#2b5cf0" stop-opacity=".30"/>
    <stop offset="1" stop-color="#2b5cf0" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="mint" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#7fd1a8" stop-opacity=".28"/>
    <stop offset="1" stop-color="#7fd1a8" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="frame"><rect width="1280" height="460" rx="20"/></clipPath>
</defs>
<g clip-path="url(#frame)">
  <rect width="1280" height="460" fill="url(#bg)"/>
  <g stroke="rgba(143,168,188,0.16)" stroke-width="1" opacity="0.3"><path d="M32 0V460"/><path d="M64 0V460"/><path d="M96 0V460"/><path d="M128 0V460"/><path d="M160 0V460"/><path d="M192 0V460"/><path d="M224 0V460"/><path d="M256 0V460"/><path d="M288 0V460"/><path d="M320 0V460"/><path d="M352 0V460"/><path d="M384 0V460"/><path d="M416 0V460"/><path d="M448 0V460"/><path d="M480 0V460"/><path d="M512 0V460"/><path d="M544 0V460"/><path d="M576 0V460"/><path d="M608 0V460"/><path d="M640 0V460"/><path d="M672 0V460"/><path d="M704 0V460"/><path d="M736 0V460"/><path d="M768 0V460"/><path d="M800 0V460"/><path d="M832 0V460"/><path d="M864 0V460"/><path d="M896 0V460"/><path d="M928 0V460"/><path d="M960 0V460"/><path d="M992 0V460"/><path d="M1024 0V460"/><path d="M1056 0V460"/><path d="M1088 0V460"/><path d="M1120 0V460"/><path d="M1152 0V460"/><path d="M1184 0V460"/><path d="M1216 0V460"/><path d="M1248 0V460"/><path d="M0 32H1280"/><path d="M0 64H1280"/><path d="M0 96H1280"/><path d="M0 128H1280"/><path d="M0 160H1280"/><path d="M0 192H1280"/><path d="M0 224H1280"/><path d="M0 256H1280"/><path d="M0 288H1280"/><path d="M0 320H1280"/><path d="M0 352H1280"/><path d="M0 384H1280"/><path d="M0 416H1280"/><path d="M0 448H1280"/></g>
  <ellipse class="glow" cx="940" cy="210" rx="420" ry="250" fill="url(#cool)"/>
  <ellipse class="glow" cx="1120" cy="120" rx="260" ry="180" fill="url(#mint)"/>

  <text x="64" y="104" class="mono dim rise" style="font-size:14px;letter-spacing:.22em">CVE-2026-43284 · LOCKED BOOTLOADER · EPHEMERAL ROOT</text>
  <text x="60" y="196" class="serif rise d1" style="font-size:92px;font-weight:700" fill="#f4efe6">GalaxyCrash</text>
  <text x="64" y="246" class="sans rise d2" style="font-size:26px;font-weight:600" fill="#7fd1a8">Root without unlocking the bootloader.</text>
  <text x="64" y="290" class="sans rise d2" style="font-size:18px" fill="#e8e2d6">No custom kernel, no Odin, no data wipe — a page-cache write</text>
  <text x="64" y="316" class="sans rise d2" style="font-size:18px" fill="#e8e2d6">loads a signed-by-nobody module through <tspan class="mono" style="font-size:17px" fill="#7fd1a8">splice()</tspan>.</text>

  <g class="rise d3">
    <rect x="64" y="350" width="392" height="48" rx="10" fill="#071018" stroke="rgba(143,168,188,0.18)"/>
    <text x="84" y="380" class="mono" style="font-size:16px" fill="#8fa8bc">$ <tspan fill="#f4efe6">./gradlew</tspan> <tspan fill="#2b5cf0">:app:assembleRelease</tspan></text>
    <rect x="366" y="366" width="9" height="18" class="caret"/>
  </g>

  <path class="wire" d="M872 118 C 936 118, 930 196, 992 196"/>
  <path class="wire" d="M872 214 C 936 214, 930 232, 992 232"/>
  <path class="wire" d="M872 310 C 936 310, 930 268, 992 268"/>
  <path class="pulse" d="M872 118 C 936 118, 930 196, 992 196"/>
  <path class="pulse p2" d="M872 214 C 936 214, 930 232, 992 232"/>
  <path class="pulse p3" d="M872 310 C 936 310, 930 268, 992 268"/>

  <g class="node n1">
    <rect x="626" y="76" width="246" height="84" rx="12" fill="#0e1c2e" stroke="rgba(143,168,188,0.18)"/>
    <rect x="626" y="76" width="246" height="84" rx="12" fill="none" class="halo"/>
    <circle cx="644" cy="96" r="4" class="led"/>
    <text x="656" y="100" class="mono head">ESP TRANSFORM</text>
    <text x="644" y="128" class="mono dim">AES-CBC + HMAC-SHA256</text>
    <text x="644" y="148" class="mono dim">decrypts into page cache</text>
  </g>
  <g class="node n2">
    <rect x="626" y="172" width="246" height="84" rx="12" fill="#0e1c2e" stroke="rgba(143,168,188,0.18)"/>
    <rect x="626" y="172" width="246" height="84" rx="12" fill="none" class="halo"/>
    <circle cx="644" cy="192" r="4" class="led"/>
    <text x="656" y="196" class="mono head">PATCHED LIBC++</text>
    <text x="644" y="224" class="mono dim">sentry() trampoline</text>
    <text x="644" y="244" class="mono dim">uid 0 · tid 1</text>
  </g>
  <g class="node n3">
    <rect x="626" y="268" width="246" height="84" rx="12" fill="#0e1c2e" stroke="rgba(143,168,188,0.18)"/>
    <rect x="626" y="268" width="246" height="84" rx="12" fill="none" class="halo"/>
    <circle cx="644" cy="288" r="4" class="led"/>
    <text x="656" y="292" class="mono head">KSUD LATE-LOAD</text>
    <text x="644" y="320" class="mono dim">KernelSU LKM live</text>
    <text x="644" y="340" class="mono dim">su granted</text>
  </g>

  <g class="ember">
    <rect x="992" y="150" width="232" height="70" rx="12" fill="#0e1c2e" stroke="#7fd1a8" stroke-opacity=".5"/>
    <text x="1108" y="180" text-anchor="middle" class="mono" style="font-size:15px" fill="#7fd1a8">ROOTED</text>
    <text x="1108" y="202" text-anchor="middle" class="mono dim" style="font-size:12px">until reboot</text>
  </g>

  <g class="ghost">
    <rect x="992" y="252" width="232" height="70" rx="12" fill="none" stroke="#ef8a80" stroke-dasharray="5 5"/>
    <text x="1108" y="282" text-anchor="middle" class="mono" style="font-size:14px" fill="#ef8a80">bootloader unlock</text>
    <path d="M1040 292 H1176" stroke="#ef8a80" stroke-width="2"/>
    <text x="1108" y="312" text-anchor="middle" class="mono dim" style="font-size:11px">not required</text>
  </g>
</g>

</svg>
